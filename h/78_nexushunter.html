<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><title>키히라 — 히오스 3D</title><style>
:root{--bg:#0b0f16;--panel:#131a24cc;--line:#243044;--fg:#e6edf7;
--dim:#8b9bb4;--accent:#4ea3ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;
font:14px/1.5 "Malgun Gothic","맑은 고딕",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;
touch-action:none;z-index:0}
canvas:active{cursor:grabbing}
/* 고정 UI 는 전부 캔버스 위로. 캔버스가 DOM 에서 나중에 오면 같은 z 에서
   위에 그려져 제목·스킨 단추가 통째로 가려진다 (실제로 그랬다). */
#top,#skins,#vars,#views,#bar,#st,#help,#msg,#axes,#anims,#credit{z-index:2}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);
background:#131a24ee;border:1px solid var(--accent);border-radius:8px;
padding:8px 14px;font-size:12px;display:none;z-index:3}
#credit{position:fixed;right:14px;bottom:12px;color:var(--dim);
font-size:10px;text-shadow:0 1px 3px #000a;pointer-events:none;
text-align:right}
#top{position:fixed;left:14px;top:12px;display:flex;align-items:center;gap:10px;
flex-wrap:wrap;max-width:calc(100% - 28px);text-shadow:0 1px 3px #000a}
#top b{font-size:18px}#top span{color:var(--dim);font-size:12px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;
display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);
max-width:calc(100% - 28px);flex-wrap:wrap;justify-content:center}
select,button{background:#1a2331;color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer;
touch-action:manipulation}
button.on{background:var(--accent);color:#04121f}
input[type=range]{width:200px;accent-color:var(--accent)}
#msg{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;color:var(--dim);pointer-events:none}
#st{position:fixed;right:14px;bottom:64px;color:var(--dim);font-size:11px;
text-shadow:0 1px 3px #000a}
#help{position:fixed;left:14px;bottom:14px;color:var(--dim);font-size:11px;
text-shadow:0 1px 3px #000a;pointer-events:none}
#skins{position:fixed;left:14px;top:44px;display:flex;gap:6px;flex-wrap:wrap;
max-width:calc(100% - 90px)}
#skins button{border-radius:14px;padding:6px 12px}
#skins button.on{background:var(--accent);color:#04121f;
border-color:var(--accent)}
/* 색배합(변형 팔레트) — 스킨 줄 바로 아래 작은 칩 */
#vars{position:fixed;left:14px;top:86px;display:flex;gap:5px;flex-wrap:wrap;
max-width:calc(100% - 90px)}
#vars button{border-radius:12px;padding:4px 10px;font-size:11px}
#vars button.on{background:#7ee0c0;color:#04231a;border-color:#7ee0c0}
#views{position:fixed;right:10px;top:50%;transform:translateY(-50%);
display:flex;flex-direction:column;gap:6px}
#views button{width:46px;height:40px;font-size:13px}
#axes{position:fixed;right:10px;bottom:74px;
display:flex;flex-direction:column;gap:7px;padding:10px 12px;
background:var(--panel);border:1px solid var(--line);border-radius:10px;
backdrop-filter:blur(6px)}
#axes label{display:flex;align-items:center;gap:8px;font-size:11px;
color:var(--dim)}
#axes span{width:44px;text-align:center;color:var(--fg);font-size:12px}
#axes b{font-size:11px;color:#7ee0c0;font-weight:700}
#axes button.ax{width:34px;height:30px;font-size:14px;padding:0;
touch-action:none;user-select:none}
#axes .tick{display:flex;align-items:center;gap:4px;font-size:10px;
color:var(--dim)}
#axes .tick button{padding:3px 8px;font-size:10px}
#axes .tick button.on{background:var(--accent);color:#04121f;
border-color:var(--accent)}
#anims{position:fixed;left:14px;top:118px;bottom:74px;width:252px;
background:var(--panel);border:1px solid var(--line);border-radius:10px;
backdrop-filter:blur(6px);display:flex;flex-direction:column;overflow:hidden}
#animFind{margin:8px;padding:7px 9px;border-radius:7px;
border:1px solid var(--line);background:#1a2331;color:var(--fg);
font:inherit;font-size:12px;outline:none}
#animFind:focus{border-color:var(--accent)}
#animList{flex:1;overflow-y:auto;padding:0 6px 8px}
.ahead{padding:9px 8px 3px;color:#7ee0c0;font-size:11px;font-weight:700}
.arow{padding:6px 9px;border-radius:6px;cursor:pointer;font-size:12px;
display:flex;gap:6px;align-items:baseline}
.arow:hover{background:#1a2331}
.arow.on{background:var(--accent);color:#04121f}
.arow .dur{margin-left:auto;color:var(--dim);font-size:10px}
.arow .fxn{color:#7ee0c0;font-size:10px}
.arow.on .dur,.arow.on .fxn{color:#0a3a5e}
#bAnims,#bAxes{display:none}
@media (max-width:640px){
 /* 메뉴는 위·아래 얇은 띠와 오른쪽 좁은 줄만 차지한다. 가운데는 늘
    캐릭터 몫이다 — 넘치는 것은 세로로 쌓지 말고 가로로 흘려보낸다. */
 #top{left:8px;top:6px;gap:6px}
 #top b{font-size:14px}
 /* 폰에서 스킨 줄이 늘 눌리게: 딴 것 위로 올리고, 가로 끌기는 스크롤로,
    단추 탭은 더블탭 확대 지연 없이 바로 먹게 한다 */
 #skins{top:32px;left:8px;right:56px;max-width:none;flex-wrap:nowrap;
  overflow-x:auto;padding-bottom:4px;scrollbar-width:none;z-index:3;
  touch-action:pan-x;-webkit-overflow-scrolling:touch}
 #skins::-webkit-scrollbar{display:none}
 #skins button{padding:6px 11px;font-size:12px;flex:none}
 #vars{top:68px;left:8px;right:56px;max-width:none;flex-wrap:nowrap;
  overflow-x:auto;padding-bottom:4px;scrollbar-width:none;z-index:3;
  touch-action:pan-x;-webkit-overflow-scrolling:touch}
 #vars::-webkit-scrollbar{display:none}
 #vars button{padding:5px 10px;font-size:11px;flex:none}
 #bar{left:8px;right:8px;transform:none;max-width:none;bottom:6px;
  gap:5px;padding:6px;flex-wrap:nowrap;overflow-x:auto;
  justify-content:flex-start;scrollbar-width:none}
 #bar::-webkit-scrollbar{display:none}
 #bar select,#bar button{padding:7px 9px;font-size:12px;flex:none}
 #bar input[type=range]{width:90px;flex:none}
 #help{display:none}
 #st{display:none}
 #views{right:4px}
 #views button{width:42px;height:36px;font-size:12px}
 /* 동작 목록·축 패널은 단추로 열고 닫는 덮개다 */
 #anims{left:8px;right:8px;width:auto;top:auto;bottom:56px;max-height:44vh;
  display:none}
 #anims.open{display:flex}
 #axes{display:none;right:52px;bottom:56px}
 #axes.open{display:flex}
 #axes button.ax{width:40px;height:36px}
 #bAnims{display:inline-block}
 #bAxes{display:block}
 #credit{right:8px;bottom:auto;top:8px;font-size:9px}
}

#bar select{display:none!important}
#anims{position:fixed;left:14px;top:150px;bottom:auto;width:auto;max-width:calc(100% - 90px);background:none;border:0;backdrop-filter:none;flex-direction:row;flex-wrap:wrap;gap:5px;overflow:visible;display:flex!important}
#animFind{display:none}
#animList{display:flex;flex-wrap:wrap;gap:5px;padding:0;overflow:visible;flex:none}
#anims .ahead{display:none}
#anims .arow{border:1px solid var(--line);border-radius:12px;background:#1a2331;padding:4px 10px;font-size:11px;display:inline-flex}
#anims .arow .dur{display:none}
#bAnims{display:none!important}
#nav{position:fixed;left:0;right:0;top:0;height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#0b0f16ee;border-bottom:1px solid #243044;z-index:5;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{color:#8b9bb4;text-decoration:none;font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid transparent;flex:none}
#nav a:hover{color:#e6edf7;border-color:#4ea3ff}
#nav a.home{color:#e6edf7;background:#131a24;border-color:#243044}
#nav a.on{background:#4ea3ff;color:#04121f;border-color:#4ea3ff}
#nav em{font-style:normal;color:#5b8dd6;font-family:Consolas,monospace;margin-right:5px}
#nav a.on em{color:#0a3a5e}
#nav .sep{color:#2c3a50;flex:none}
#top{top:46px}#skins{top:78px}#vars{top:120px}
@media (max-width:640px){#nav{height:32px;padding:0 8px}#top{top:38px}#skins{top:64px}#vars{top:100px}#anims{left:8px;right:8px;top:136px;max-width:none;max-height:none}}
</style></head><body><div id=nav><a class=home href='../index.html'>← 영웅 목록</a></div>
<div id="top"><b id="t"></b><span id="s"></span></div>
<div id="skins"></div>
<div id="vars"></div>
<canvas id="gl"></canvas>
<div id="bar">
<button id="bPlay">⏸</button>
<button id="bSpin">회전</button>
<button id="bHome">시점</button>
<button id="bAnims">동작 목록</button>
<select id="faceSel" title="표정"></select>
<input type="range" id="tl" min="0" max="1000" value="0">
<select id="speedSel" title="속도"><option value="0.25">0.25×</option>
<option value="0.5">0.5×</option><option value="1" selected>1×</option>
<option value="2">2×</option></select>
</div>
<div id="views">
<button id="vFront" title="정면">앞</button>
<button id="vSide" title="옆면">옆</button>
<button id="vBack" title="뒷면">뒤</button>
<button id="vTop" title="위에서">위</button>
<button id="bZin" title="확대">＋</button>
<button id="bZout" title="축소">－</button>
<button id="bAxes" title="시야를 화면축으로 돌리기">축</button>
<button id="bShot" title="지금 보이는 시점을 PNG 로 저장">📷</button>
<button id="bCopy" title="지금 보이는 시점을 클립보드에 복사">📋</button>
<button id="bFull" title="전체화면">⛶</button>
</div>
<div id="axes"><b>시야 회전</b>
<div class="tick">단위
<button data-t="5">5°</button><button data-t="15" class="on">15°</button>
<button data-t="45">45°</button><button data-t="90">90°</button></div>
<label>상하 <button class="ax" data-a="0" data-d="-1">−</button><span id="rXv">0°</span><button class="ax" data-a="0" data-d="1">＋</button></label>
<label>좌우 <button class="ax" data-a="1" data-d="-1">−</button><span id="rYv">0°</span><button class="ax" data-a="1" data-d="1">＋</button></label>
<label>기울 <button class="ax" data-a="2" data-d="-1">−</button><span id="rZv">0°</span><button class="ax" data-a="2" data-d="1">＋</button></label>
<button id="rotReset">초기화</button>
</div>
<div id="anims">
<input id="animFind" placeholder="동작 찾기… (예: 눈보라, spell)">
<div id="animList"></div>
</div>
<div id="st"></div>
<div id="help">끌기 = 돌리기 · 휠 = 확대 · 오른쪽/두손가락 = 이동 · 오므리기 = 확대</div>
<div id="toast"></div>
<div id="credit">제작 SINONIS · Claude(Anthropic) 도움 ·
모델·텍스처 © Blizzard Entertainment</div>
